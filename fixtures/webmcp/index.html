<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-webmcp fixture</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 2rem;
        line-height: 1.45;
      }
      .app {
        max-width: 56rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1rem;
      }
      .panel {
        border: 1px solid #8884;
        border-radius: 8px;
        padding: 1rem;
      }
      .panel h2 {
        margin-top: 0;
        font-size: 1.05rem;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.35rem 0;
        flex-wrap: wrap;
      }
      .muted {
        opacity: 0.7;
        font-size: 0.9rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.3rem 0.5rem;
        border-bottom: 1px solid #8883;
        vertical-align: top;
      }
      code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.85em;
      }
      .status-registered {
        color: #0b7a3b;
      }
      .status-unavailable,
      .status-disabled {
        color: #8a6d00;
      }
      .status-error,
      .status-unsupported {
        color: #b3261e;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/dist/bundle.js"></script>
  </body>
</html>
